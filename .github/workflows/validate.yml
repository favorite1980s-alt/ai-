name: Validate offline captions MVP
on:
  push:
    branches: [main, feature/offline-captions-dictionary]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m json.tool extension/manifest.json > /dev/null
      - run: python -m compileall -q backend
      - run: node --check extension/background.js
      - run: node --check extension/offscreen.js
      - run: node --check extension/content.js
      - run: node --check extension/lexicon.js
      - run: node --check extension/popup.js
      - run: node tests/test_lexicon.js
