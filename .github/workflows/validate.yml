name: Validate offline captions MVP
on:
  push:
    branches: [main, feature/offline-captions-dictionary, feature/expanded-offline-dictionary]
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m json.tool extension/manifest.json > /dev/null
      - run: python -m compileall -q backend
      - run: node --check extension/background.js
      - run: node --check extension/offscreen.js
      - run: node --check extension/content.js
      - run: node --check extension/lexicon.js
      - run: node --check extension/popup.js
      - run: node tests/test_lexicon.js
      - name: Test mocked local transcription WebSocket
        run: |
          python -m pip install --disable-pip-version-check fastapi numpy httpx
          python tests/test_backend.py
      - name: Download and verify CC BY-SA 4.0 English-Korean dictionary
        run: |
          python tools/prepare_dictionary.py
          python tests/test_large_dictionary.py
      - name: Build Windows source ZIP
        run: |
          python - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          names=["extension","backend","licenses","install.bat","install-windows.ps1","start-server.bat","README.md","LICENSE","THIRD_PARTY_NOTICES.md"]
          with ZipFile("Movie-English-Study-Windows-MVP.zip","w",ZIP_DEFLATED) as output:
              for name in names:
                  p=Path(name)
                  for file in (p.rglob("*") if p.is_dir() else [p]):
                      if file.is_file() and "__pycache__" not in file.parts:
                          output.write(file,file.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Movie-English-Study-Windows-MVP
          path: Movie-English-Study-Windows-MVP.zip
          retention-days: 30
