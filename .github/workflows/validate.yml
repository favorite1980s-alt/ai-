name: Sequential verification · Movie English Study
on:
  push:
    branches: [main, feature/sequential-verification-v03]
  pull_request:

permissions:
  contents: read

jobs:
  dictionary:
    name: "01 Dictionary: 48k data, license and integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify bundled license/attribution
        run: |
          test -f licenses/OPEN_EN_KO_DICTIONARY_CREDITS.md
          test -f licenses/KAMI_SUBS_MIT.txt
          grep -q 'CC BY-SA 4.0' THIRD_PARTY_NOTICES.md
      - name: Download pinned, SHA-verified dictionary (48,037 entries)
        run: |
          python tools/prepare_dictionary.py
          python tests/test_large_dictionary.py
      - name: Validate Chrome dictionary service, inflections, cache
        run: node tests/test_dictionary_service.js
      - name: Test smaller fallback dictionary
        run: node tests/test_lexicon.js

  browser:
    name: "02 Chromium: caption, click, Korean, saved words"
    needs: [dictionary]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download and verify dictionary
        run: python tools/prepare_dictionary.py
      - name: Validate JavaScript and manifest version
        run: |
          python -m json.tool extension/manifest.json > /dev/null
          node --check extension/background.js
          node --check extension/offscreen.js
          node --check extension/content.js
          node --check extension/lexicon.js
          node --check extension/popup.js
      - name: Install headless Chromium driver
        run: npm install --no-save puppeteer-core@24.26.1
      - name: Exercise rendered subtitle interactions in real Chromium
        run: node tests/test_browser_ui.js

  websocket:
    name: "03 Local audio: WebSocket protocol and origin"
    needs: [browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Python compilation and mocked PCM/WebSocket test
        run: |
          python -m compileall -q backend tools
          python -m pip install --disable-pip-version-check fastapi numpy httpx
          python tests/test_backend.py

  windows:
    name: "04 Windows-latest: installer, imports and server health"
    needs: [websocket]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run Windows installer then start real FastAPI process
        shell: pwsh
        run: ./tests/test_windows.ps1

  package:
    name: "05 ZIP: exact manifest, dictionary, dependencies"
    needs: [windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch verified dictionary and build self-tested ZIP
        run: |
          python tools/prepare_dictionary.py
          python tools/build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Movie-English-Study-Windows-MVP
          path: Movie-English-Study-Windows-MVP.zip
          retention-days: 30
